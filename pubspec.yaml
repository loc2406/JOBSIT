name: jobsit_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.1 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.17
  http: ^1.3.0
  flutter_bloc: ^9.0.0
  infinite_scroll_pagination: 4.1.0
  shared_preferences: ^2.5.2
